<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>商品・制作者管理</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="header">

    <h1>🎪 文化祭 売上管理</h1>

    <nav class="navigation">

        <a
            href="index.html"
            class="nav-link"
        >
            📊 売上明細
        </a>

        <a
            href="register.html"
            class="nav-link"
        >
            ➕ 売上登録
        </a>

        <a
            href="manage.html"
            class="nav-link active"
        >
            ⚙️ 商品・制作者管理
        </a>

    </nav>

</header>


<main class="main-content">


<section class="manage-section">

    <h2>⚙️ 商品・制作者管理</h2>


    <!-- ==================================================
         文化祭管理
    ================================================== -->

    <section class="event-management">

        <h3>🎪 文化祭を管理</h3>


        <div class="form-item">

            <label for="eventNameInput">
                文化祭名
            </label>

            <input
                type="text"
                id="eventNameInput"
                placeholder="例：2026年度 笑顔祭"
            >

        </div>


        <div class="form-item">

            <label for="eventDaysInput">
                開催日数
            </label>

            <select id="eventDaysInput">

                <option value="1">
                    1日間
                </option>

                <option value="2" selected>
                    2日間
                </option>

                <option value="3">
                    3日間
                </option>

            </select>

        </div>


        <button
            id="addEventButton"
            class="register-button"
        >
            🎪 文化祭を登録
        </button>


        <p
            id="eventMessage"
            class="register-message"
        ></p>


        <div
            id="eventList"
            class="event-list"
        ></div>

    </section>


    <!-- ==================================================
         制作者管理用の文化祭選択
    ================================================== -->

    <section class="event-select-section">

        <h3>🎪 制作者を管理する文化祭を選択</h3>


        <div class="form-item">

            <label for="eventSelect">
                管理する文化祭
            </label>

            <select id="eventSelect">

                <option value="">
                    開催イベントを選択
                </option>

            </select>

        </div>

    </section>


    <!-- ==================================================
         制作者
    ================================================== -->

    <section class="creator-management">

        <h3>👤 制作者を管理</h3>


        <div class="form-item">

            <label for="creatorInput">
                制作者名
            </label>

            <input
                type="text"
                id="creatorInput"
                placeholder="制作者名を入力"
            >

        </div>


        <button
            id="addCreatorButton"
            class="register-button"
        >
            👤 制作者を登録
        </button>


        <p
            id="creatorMessage"
            class="register-message"
        ></p>


        <div
            id="creatorList"
            class="creator-list"
        >

            <p>
                開催イベントを選択してください。
            </p>

        </div>

    </section>


    <!-- ==================================================
         商品追加
    ================================================== -->

    <section class="add-product-section">

        <h3>➕ 商品を追加</h3>


        <!-- 商品登録用の文化祭選択 -->

        <div class="form-item">

            <label for="productEventSelect">
                🎪 文化祭
            </label>

            <select id="productEventSelect">

                <option value="">
                    文化祭を選択
                </option>

            </select>

        </div>


        <!-- 制作者 -->

        <div class="form-item">

            <label for="productCreatorSelect">
                👤 制作者
            </label>

            <select id="productCreatorSelect">

                <option value="">
                    先に文化祭を選択してください
                </option>

            </select>

        </div>


        <!-- 商品名 -->

        <div class="form-item">

            <label for="productInput">
                🛍️ 商品名
            </label>

            <input
                type="text"
                id="productInput"
                placeholder="商品名を入力"
            >

        </div>


        <!-- 単価 -->

        <div class="form-item">

            <label for="priceInput">
                💴 単価
            </label>

            <input
                type="number"
                id="priceInput"
                min="0"
                step="1"
                placeholder="単価を入力"
            >

        </div>


        <button
            id="addProductButton"
            class="register-button"
        >
            ➕ 商品を登録
        </button>


        <p
            id="productMessage"
            class="register-message"
        ></p>

    </section>


    <!-- ==================================================
         商品一覧
    ================================================== -->

    <section class="product-list-section">

        <h3>📋 登録済み商品</h3>


        <div id="productList">

            <p>
                開催イベントを選択してください。
            </p>

        </div>

    </section>


</section>


</main>


<script
    type="module"
    src="manage.js"
></script>


</body>

</html>
