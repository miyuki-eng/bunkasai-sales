<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>売上登録</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header class="header">

    <h1>🎪 文化祭 売上管理</h1>

    <nav class="navigation">

        <a href="index.html"
           class="nav-link">
            📊 売上明細
        </a>

        <a href="register.html"
           class="nav-link active">
            ➕ 売上登録
        </a>

        <a href="manage.html"
           class="nav-link">
            ⚙️ 商品・制作者管理
        </a>

    </nav>

</header>


<main class="main-content">


    <section class="register-section">

        <h2>➕ 売上登録</h2>


        <div class="form-item">

            <label for="eventSelect">
                🎪 開催イベント
            </label>

            <select id="eventSelect">

                <option value="">
                    開催イベントを選択
                </option>

            </select>

        </div>


        <div class="form-item">

            <label for="daySelect">
                📅 開催日
            </label>

            <select id="daySelect">

                <option value="">
                    開催日を選択
                </option>

                <option value="1">
                    1日目
                </option>

                <option value="2">
                    2日目
                </option>

            </select>

        </div>


        <div class="form-item">

            <label for="creatorSelect">
                👤 制作者
            </label>

            <select id="creatorSelect">

                <option value="">
                    制作者を選択
                </option>

            </select>

        </div>


        <div class="form-item">

            <label for="productSelect">
                🛍️ 商品名
            </label>

            <select id="productSelect">

                <option value="">
                    商品を選択
                </option>

            </select>

        </div>


        <div class="form-item">

            <label for="quantityInput">
                🔢 個数
            </label>

            <input
                type="number"
                id="quantityInput"
                min="1"
                step="1"
                placeholder="個数を入力"
            >

        </div>


        <div class="calculation-area">

            <div class="calculation-item">

                <span>
                    💴 単価
                </span>

                <strong id="unitPrice">
                    ￥0
                </strong>

            </div>


            <div class="calculation-item">

                <span>
                    💰 売上金額
                </span>

                <strong id="totalPrice">
                    ￥0
                </strong>

            </div>

        </div>


        <button
            id="registerButton"
            class="register-button">

            ➕ 登録する

        </button>


        <p
            id="registerMessage"
            class="register-message">
        </p>


    </section>

</main>


<script type="module" src="register.js"></script>


</body>

</html>
